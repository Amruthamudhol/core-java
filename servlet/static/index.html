<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Workz Servlet Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body{
            background: linear-gradient(to right,#74ebd5,#9face6);
            font-family: Arial, sans-serif;
        }
        .card{
            width:650px;
            margin:60px auto;
            border:none;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.3);
        }

        .card-header{
            background:#0d6efd;
            color:white;
            text-align:center;
            font-size:34px;
            font-weight:bold;
            padding:20px;
        }

        .btn{
            width:100%;
            margin-top:15px;
            font-size:20px;
            transition:.3s;
        }

        .btn:hover{
            transform:scale(1.03);
        }

        i{
            margin-right:10px;
        }

        .footer{
            text-align:center;
            margin-top:25px;
            color:gray;
            font-size:15px;
        }

    </style>

</head>

<body>

<div class="card">
    <div class="card-header">
        X-Workz Servlet Applications
    </div>

    <div class="card-body">

        <a href="hotel.html" class="btn btn-primary">
            <i class="fa-solid fa-hotel"></i>Hotel Booking
        </a>

        <a href="recipe.html" class="btn btn-success">
            <i class="fa-solid fa-utensils"></i>Recipe Management
        </a>

        <a href="vehicle.html" class="btn btn-warning">
            <i class="fa-solid fa-car"></i>Vehicle Registration
        </a>

        <a href="event.html" class="btn btn-info">
            <i class="fa-solid fa-calendar-days"></i>Event Registration
        </a>

        <a href="trip.html" class="btn btn-danger">
            <i class="fa-solid fa-plane"></i>Travel Trip Management
        </a>

        <div class="footer">
            © 2026 X-Workz Servlet Project
        </div>

    </div>

</div>

</body>
</html>
