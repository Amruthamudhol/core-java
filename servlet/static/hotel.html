<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>x-workz</title>
  <title>Hotel Booking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<style>
  body{
      background-color: #e3f2fd;
  }
</style>

<body class="container mt-4">

<h2>Hotel Booking Form</h2>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold" href="index.html">
      X-Workz
    </a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav me-auto">

        <li class="nav-item">
          <a class="nav-link active" href="hotel.html">🏨 Hotel Booking</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="recipe.html">🍽️ Recipe Management</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="vehicle.html">🚗 Vehicle Registration</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="event.html">🎉 Event Registration</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="trip.html">✈️ Travel Trip</a>
        </li>

      </ul>

      <a href="index.html" class="btn btn-outline-light">
        🏠 Home
      </a>

    </div>

  </div>
</nav>
<form action="booking" method="post">

  <div class="mb-3">
    <label class="form-label">Guest Name</label>
    <input type="text" class="form-control" name="gname">
  </div>

  <div class="mb-3">
    <label class="form-label">Check-in Date</label>
    <input type="date" class="form-control" name="cidate">
  </div>

  <div class="mb-3">
    <label class="form-label">Check-out Date</label>
    <input type="date" class="form-control" name="codate">
  </div>

  <div class="mb-3">
    <label class="form-label">Room Type</label>
    <select class="form-control" name="room">
      <option value="">Select Room</option>
      <option value="Single">Single</option>
      <option value="Double">Double</option>
      <option value="Family">Family</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Number of Guests</label>
    <input type="number" class="form-control" name="guestno">
  </div>

  <div class="mb-3">
    <label class="form-label">Total Amount</label>
    <input type="number" step="0.01" class="form-control" name="amount">
  </div>

  <button type="submit" class="btn btn-primary">Book Room</button>

</form>

<div class="mt-3">
  <a href="index.html" class="btn btn-secondary">
    ← Back to Home
  </a>
</div>



</body>
</html>
