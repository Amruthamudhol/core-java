<div class="container mt-4">

    <h2>Recipe Management Form</h2>

    <form action="recipe" method="post">

        <div class="mb-3">
            <label class="form-label">Recipe Name</label>
            <input type="text" class="form-control" name="recipeName">
        </div>

        <div class="mb-3">
            <label class="form-label">Cuisine Type</label>
            <input type="text" class="form-control" name="cuisine">
        </div>

        <div class="mb-3">
            <label class="form-label">Cooking Time (Minutes)</label>
            <input type="number" class="form-control" name="time">
        </div>

        <div class="mb-3">
            <label class="form-label">Difficulty Level</label>
            <select class="form-control" name="difficulty">
                <option value="">Select</option>
                <option value="EASY">Easy</option>
                <option value="MEDIUM">Medium</option>
                <option value="HARD">Hard</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Ingredients Count</label>
            <input type="number" class="form-control" name="ingredients">
        </div>

        <div class="mb-3">
            <label class="form-label">Calories</label>
            <input type="number" class="form-control" name="calories">
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="index.html" class="btn btn-secondary">Back to Home</a>

    </form>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
