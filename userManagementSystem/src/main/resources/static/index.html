<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            User Management System
        </a>

        <div>
            <a href="Signup.jsp" class="btn btn-light me-2">Sign Up</a>
            <a href="SignIn.jsp" class="btn btn-warning me-2">Sign In</a>
            <a href="Feedback.jsp" class="btn btn-success">Feedback</a>
        </div>
    </div>
</nav>

<div class="container text-center mt-5">

    <h1>Welcome to User Management System</h1>

    <p class="lead mt-3">
        Manage your account and share your valuable feedback.
    </p>

    <div class="row justify-content-center mt-5">

        <!-- Sign Up -->
        <div class="col-md-3">
            <div class="card shadow p-3">
                <h3>Sign Up</h3>
                <p>Create a new account.</p>
                <a href="Signup.jsp" class="btn btn-primary">
                    Sign Up
                </a>
            </div>
        </div>

        <!-- Sign In -->
        <div class="col-md-3">
            <div class="card shadow p-3">
                <h3>Sign In</h3>
                <p>Login to your account.</p>
                <a href="SignIn.jsp" class="btn btn-warning">
                    Sign In
                </a>
            </div>
        </div>

        <!-- Feedback -->
        <div class="col-md-3">
            <div class="card shadow p-3">
                <h3>Feedback</h3>
                <p>Share your feedback.</p>
                <a href="Feedback.jsp" class="btn btn-success">
                    Give Feedback
                </a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
